services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: hrmanagementsystem
      MARIADB_USER: hruser
      MARIADB_PASSWORD: hrpass123
      MARIADB_ROOT_PASSWORD: rootpass123
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - app

volumes:
  dbdata:
