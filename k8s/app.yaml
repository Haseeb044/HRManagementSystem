apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: haseeb0440/hr-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 9000
          env:
            - name: APP_NAME
              value: HRManagementSystem
            - name: APP_ENV
              value: production
            - name: APP_DEBUG
              value: "false"
            - name: APP_URL
              value: http://localhost
            - name: LOG_CHANNEL
              value: stderr
            - name: DB_CONNECTION
              value: mysql
            - name: DB_HOST
              value: db
            - name: DB_PORT
              value: "3306"
            - name: DB_DATABASE
              value: hrmanagementsystem
            - name: DB_USERNAME
              value: hruser
            - name: SESSION_DRIVER
              value: database
            - name: CACHE_STORE
              value: database
            - name: QUEUE_CONNECTION
              value: database
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: hr-secret
                  key: APP_KEY
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hr-secret
                  key: DB_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: app
spec:
  selector:
    app: app
  ports:
    - port: 9000
      targetPort: 9000
